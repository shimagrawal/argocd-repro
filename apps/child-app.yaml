apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: repro-child
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/argoproj/argocd-example-apps.git
    targetRevision: HEAD
    path: kustomize-guestbook
    kustomize:
      replicas:
        - name: kustomize-guestbook-ui
          count: 1
  destination:
    name: cluster-uat
    namespace: demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
