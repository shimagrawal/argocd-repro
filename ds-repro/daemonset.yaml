apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-agent
spec:
  selector:
    matchLabels: {app: node-agent}
  template:
    metadata:
      labels: {app: node-agent}
    spec:
      nodeSelector:
        demo/node-agent: "enabled"   # pod only runs on nodes with this label, which is how we simulate a "new node"
      containers:
      - name: agent
        image: nginx:1.27
        readinessProbe:
          httpGet: {path: /, port: 80}
          initialDelaySeconds: 60    # keeps it Progressing for ~60s so you can watch it# touch 1791889432
